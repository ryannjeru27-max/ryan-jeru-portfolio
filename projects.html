<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Ryan Jeru - Programming Projects">

    <title>Ryan Jeru | Projects</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="site-header">

    <a class="logo" href="index.html">
        RJ<span>.</span>
    </a>


    <button
        class="menu-toggle"
        aria-label="Open navigation">

        ☰

    </button>


    <nav class="nav">

        <a class="nav-link"
           href="index.html">
            Home
        </a>

        <a class="nav-link"
           href="about.html">
            About
        </a>

        <a class="nav-link"
           href="skills.html">
            Skills
        </a>

        <a class="nav-link active"
           href="projects.html">
            Projects
        </a>

        <a class="nav-link"
           href="interests.html">
            Interests
        </a>

        <a class="nav-link"
           href="contact.html">
            Contact
        </a>

    </nav>

</header>



<!-- =========================================
     MAIN
========================================= -->

<main>


<section class="page-hero">

    <p class="eyebrow">
        MY WORK
    </p>

    <h1>
        Projects & Experiments
    </h1>

    <p>
        A collection of programming projects,
        experiments and ideas that I am building
        while learning technology.
    </p>

</section>



<!-- =========================================
     PROJECT FILTER
========================================= -->

<section class="section">


<div class="project-filters">

    <button
        class="filter-btn active"
        data-filter="all">

        All

    </button>


    <button
        class="filter-btn"
        data-filter="web">

        Web

    </button>


    <button
        class="filter-btn"
        data-filter="python">

        Python

    </button>


    <button
        class="filter-btn"
        data-filter="ai">

        AI

    </button>


    <button
        class="filter-btn"
        data-filter="tools">

        Tools

    </button>

</div>



<!-- =========================================
     PROJECT CARDS
========================================= -->

<div
    class="project-grid"
    id="projectGrid">

    <!-- JavaScript creates the projects here -->

</div>


</section>


</main>



<!-- =========================================
     PROJECT DETAILS MODAL
========================================= -->

<div
    class="modal"
    id="projectModal"
    aria-hidden="true">


    <div class="modal-box">


        <button
            class="close-modal"
            aria-label="Close">

            ×

        </button>


        <div
            class="modal-icon"
            id="modalIcon">

        </div>


        <p class="eyebrow">
            PROJECT DETAILS
        </p>


        <h2 id="modalTitle">
        </h2>


        <p id="modalDescription">
        </p>


        <div
            class="modal-tech"
            id="modalTech">

        </div>


    </div>

</div>



<!-- =========================================
     FOOTER
========================================= -->

<footer>

    <p>

        © <span class="year"></span>
        Ryan Jeru.

        Built with HTML, CSS & JavaScript.

    </p>

</footer>



<script src="js/script.js"></script>


</body>

</html>
